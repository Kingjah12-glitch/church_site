<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#353982">
<title>Hymns | Church of Christ, Abakaliki</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="bar">
  <a class="brand" href="index.html"><img src="logo.png" alt=""><span>Church of Christ</span></a>
  <nav class="nav" aria-label="Main">
    <a href="index.html">Home</a>
    <a href="services.html">Times</a>
    <a href="order.html">Program</a>
    <a href="hymns.html" aria-current="page">Hymns</a>
    <a href="contact.html">Contact</a>
  </nav>
</div></header>

<main class="fill">
  <div class="hymns">
    <section class="pane" id="browse">
      <input class="search" id="q" type="search" placeholder="Search for a hymn…" autocomplete="off" aria-label="Search hymns">
      <div class="letters" id="letters" aria-label="Browse by letter"></div>
      <p class="count-line" id="countLine"></p>
      <ul class="results" id="results"></ul>
    </section>

    <article class="pane" id="reader" hidden>
      <div class="tools">
        <button id="back">Back to list</button>
        <button id="smaller" aria-label="Smaller text">A−</button>
        <button id="bigger" aria-label="Bigger text">A+</button>
        <a id="share" href="#" target="_blank" rel="noopener">WhatsApp</a>
      </div>
      <h2 id="rTitle"></h2>
      <div class="lyrics" id="rBody"></div>
    </article>
  </div>
</main>

<script>
let HYMNS = [];
let letter = "";
let size = 1.25;
const $ = id => document.getElementById(id);

const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();

fetch("hymns.json")
  .then(r => r.json())
  .then(data => {
    HYMNS = data.map(h => ({ ...h, _t: norm(h.title), _x: norm(h.slides.join(" ")) }));
    buildLetters();
    renderList();
    openFromHash();
  })
  .catch(() => { $("results").innerHTML = '<li class="empty">Could not load the hymns. Please try again.</li>'; });

function buildLetters() {
  const letters = [...new Set(HYMNS.map(h => h.letter))].sort();
  $("letters").innerHTML = "";
  letters.forEach(L => {
    const b = document.createElement("button");
    b.textContent = L;
    b.dataset.l = L;
    b.onclick = () => {
      letter = (letter === L ? "" : L);
      document.querySelectorAll("#letters button").forEach(x => x.classList.toggle("on", x.dataset.l === letter));
      renderList();
    };
    $("letters").appendChild(b);
  });
}

function renderList() {
  const q = norm($("q").value);
  const words = q ? q.split(" ") : [];
  const list = HYMNS.filter(h => (!letter || h.letter === letter) &&
    words.every(w => h._t.includes(w) || h._x.includes(w)));

  if (q) {
    const score = h => h._t.startsWith(q) ? 0 : h._t.includes(q) ? 1 : words.every(w => h._t.includes(w)) ? 2 : 3;
    list.sort((a, b) => score(a) - score(b) || a.title.localeCompare(b.title));
  }

  const shown = list.slice(0, 80);
  $("countLine").textContent = list.length + (list.length === 1 ? " hymn" : " hymns") +
    (list.length > shown.length ? " (showing the first " + shown.length + ", type more to narrow down)" : "");

  const ul = $("results");
  ul.innerHTML = "";
  if (!shown.length) {
    ul.innerHTML = '<li class="empty">No hymn found. Try fewer or different words.</li>';
    return;
  }
  shown.forEach(h => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    const t = document.createElement("span"); t.className = "ti"; t.textContent = h.title;
    const p = document.createElement("span"); p.className = "pv"; p.textContent = h.slides[0].replace(/\n/g, " ");
    b.append(t, p);
    b.onclick = () => { location.hash = h.id; };
    li.appendChild(b);
    ul.appendChild(li);
  });
}

function openFromHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  const h = HYMNS.find(x => x.id === id);
  if (!h) { $("reader").hidden = true; $("browse").hidden = false; return; }
  $("rTitle").textContent = h.title;
  const body = $("rBody");
  body.innerHTML = "";
  h.slides.forEach(s => {
    const d = document.createElement("div");
    d.className = "verse-block";
    d.textContent = s;
    body.appendChild(d);
  });
  body.scrollTop = 0;
  $("share").href = "https://wa.me/?text=" + encodeURIComponent(h.title + " - " + location.href);
  $("browse").hidden = true;
  $("reader").hidden = false;
}

function setSize(v) {
  size = Math.min(2.2, Math.max(0.95, v));
  document.documentElement.style.setProperty("--lyric", size + "rem");
}

$("q").addEventListener("input", renderList);
$("back").onclick = () => { history.pushState("", "", location.pathname); openFromHash(); };
$("smaller").onclick = () => setSize(size - 0.15);
$("bigger").onclick = () => setSize(size + 0.15);
window.addEventListener("hashchange", openFromHash);
</script>
</body>
</html>
